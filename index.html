<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanatın Zaman Yolculuğu — Dijital Sergi</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        body {
            background-color: #0d0d0d;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        /* Tam Ekran Slayt Yapısı */
        .slide-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100vh;
            scroll-behavior: smooth;
        }

        .slide {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            position: relative;
            transition: background 0.6s ease;
        }

        /* Slayt Temaları ve Arka Plan Gradyanları */
        #slide1 {
            background: radial-gradient(circle at center, #2d1b11 0%, #0d0d0d 100%);
        }

        #slide2 {
            background: linear-gradient(135deg, #1c1917 0%, #3b2414 100%);
        }

            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
